[project]
name = "translanguage"
version = "0.1.0"
description = "Extensible video translation and dubbing desktop application"
requires-python = ">=3.11"
dependencies = [
    "audio-separator>=0.47,<1",
    "audioread>=3.0.1,<4",
    # Faster Whisper 1.2.1 còn truyền metadata_errors; PyAV 19 đã xóa tham số này.
    "av>=11,<19",
    "faster-whisper>=1.2.1,<2",
    "stable-ts>=2.19.1,<3",
    "silero-vad>=5,<7",
    "rapidocr==3.10.0",
    "opencc-python-reimplemented>=0.1.7,<1",
    "pyannote.audio>=4,<5",
    "edge-tts>=7.2,<8",
    "google-genai>=2.26,<3",
    "PySide6>=6.7,<7",
    "soundfile>=0.12,<1",
    "scipy>=1.11,<2",
    "safetensors>=0.4,<1",
    "transformers>=5,<6",
    "vieneu>=3.8,<4",
]

[project.optional-dependencies]
cpu = ["audio-separator[cpu]>=0.47,<1"]
cuda = [
    "audio-separator[gpu]>=0.47,<1",
    # GTX 10xx/Pascal cần nhánh cuDNN còn hỗ trợ compute capability 6.x.
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cudnn-cu12==9.6.0.74",
    # Giữ cùng ONNX Runtime GPU với môi trường OCR V25 đã xác minh trên GTX 1060.
    "onnxruntime-gpu==1.23.2",
]

[project.scripts]
translanguage = "video_translator.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translator*"]

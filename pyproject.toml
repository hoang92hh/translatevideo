[project]
name = "translanguage"
version = "0.1.0"
description = "Extensible video translation and dubbing desktop application"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7,<7",
]

[project.scripts]
translanguage = "video_translator.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["video_translator*"]

